server {
    listen 80;
    listen [::]:80;
    server_name mrtraders.site www.mrtraders.site portal.mrtraders.site;

    # Include existing security snippets if present on VPS
    include snippets/security.conf;

    # Document Root (Built Vite Frontend)
    root /var/www/mrtraders/dist;
    index index.html;

    client_max_body_size 20M;

    # =========================================================================
    # 1. Gzip Compression (PageSpeed & AI Crawlers)
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # =========================================================================
    # 2. Canonical 301 Redirects (SEO Cleanup)
    # =========================================================================
    # Redirect legacy /classic route to root
    location = /classic {
        return 301 /;
    }
    location = /classic/ {
        return 301 /;
    }

    # =========================================================================
    # 3. SEO & AI Crawler Directives (GEO / AEO)
    # =========================================================================
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        allow all;
        log_not_found off;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # =========================================================================
    # 4. Caching Rules
    # =========================================================================
    # HTML files: NEVER CACHE
    # Ensures AI search bots (GPTBot, Googlebot, Perplexity) always get fresh schemas & noscript
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    # Static Assets (Vite chunked JS & CSS in /assets/): Cache 1 Year Immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Media, Fonts & Images
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|mp4|webm|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # =========================================================================
    # 5. React Router Single Page Application (SPA Fallback)
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================================================
    # 6. Backend API Reverse Proxy (Express Node.js on port 3001)
    # =========================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for PDF generation and heavy operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # =========================================================================
    # 7. Security: Block hidden files (.git, .env, etc.)
    # =========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
