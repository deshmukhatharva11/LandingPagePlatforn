# ==============================================================================
# MR Interiors (mrtraders.site) — Production Nginx Configuration
# Optimized for SPA routing, High Performance & GEO / AEO AI Crawlers
# Place in: /etc/nginx/sites-available/mrtraders.site
# Symlink to: /etc/nginx/sites-enabled/mrtraders.site
# ==============================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name mrtraders.site www.mrtraders.site;

    # Let's Encrypt challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/mrtraders.site/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mrtraders.site www.mrtraders.site;

    # Document Root (where your dist/ files live)
    root /var/www/mrtraders.site/html;
    index index.html;

    # SSL Certificates (managed by certbot)
    # ssl_certificate /etc/letsencrypt/live/mrtraders.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mrtraders.site/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # GZIP Compression for Fast PageSpeed & AI Crawlers
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # 301 Redirect for legacy /classic -> /
    location = /classic {
        return 301 /;
    }

    # Static SEO files (robots.txt and sitemap.xml)
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
        expires 1d;
    }

    location = /sitemap.xml {
        allow all;
        log_not_found off;
        access_log off;
        expires 1d;
    }

    # SPA Routing: Fallback all client routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML files: Do NOT cache so AI crawlers always get fresh noscript & schema
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Static assets (JS, CSS, images, fonts, videos): Cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|mp4|webm|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # API Proxy (if proxying PHP or backend service)
    location /api/ {
        try_files $uri $uri/ =404;
    }

    # Block access to hidden files (e.g. .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
